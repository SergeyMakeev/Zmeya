name: asan

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=1

jobs:
  linux-asan:
    name: Linux ASAN (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      GTEST_DEATH_TEST_STYLE: threadsafe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang

      - name: Configure
        run: cmake -S "${{ github.workspace }}" -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DZMEYA_ENABLE_ASAN=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ./ZmeyaTest

  macos-asan:
    name: macOS ASAN (clang++)
    runs-on: macos-latest
    env:
      CC: clang
      CXX: clang++
      GTEST_DEATH_TEST_STYLE: threadsafe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S "${{ github.workspace }}" -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DZMEYA_ENABLE_ASAN=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ./ZmeyaTest
