name: build

on: [push]

jobs:
  build-unix:
    strategy:
      matrix:
        os: [ubuntu, macos]
        compiler: [g++, clang++]
        defines: [standard]
        exclude:
          - os: macos
            compiler: g++
    name: ${{matrix.os}} ${{matrix.compiler}}
    runs-on: ${{matrix.os}}-latest
    steps:
    - uses: actions/checkout@v1
    - name: Update submodules
      run: git submodule update --init --recursive
    - name: CMake Configure
      run: mkdir build && cd build && cmake ..
    - name: Build
      run: cd build && cmake --build . --config Release
    - name: Run unit tests
      run: cd build && ./ZmeyaTest
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [Win32, x64]
        defines: [standard]
    env:
      # GoogleTest: first '-' starts the negative pattern list (colon-separated). Same exclusions as build_release.cmd / build_debug.cmd OpenCppCoverage pass.
      ZMEYA_GTEST_FILTER_INSTRUMENTED: '-ZmeyaTestSuite.Coverage_P1_LargeNIncrementalHashMapVsGolden:ZmeyaTestSuite.Coverage_P13_IncrementalHashWallTimeBoundReleaseOnly:ZmeyaTestSuite.ListTest'
    steps:
    - uses: actions/checkout@v1
    - name: Update submodules
      run: git submodule update --init --recursive
    - name: CMake Configure
      run: mkdir build && cd build && cmake ..
    - name: Build
      run: cd build && cmake --build . --config Release
    - name: Run unit tests (full suite, no instrumentation)
      run: build/Release/ZmeyaTest.exe
    - name: Install OpenCppCoverage
      if: matrix.arch == 'x64'
      run: choco install opencppcoverage -y
    - name: Run unit tests under instrumentation (slow tests excluded)
      if: matrix.arch == 'x64'
      shell: pwsh
      run: |
        $env:PATH = "C:\Program Files\OpenCppCoverage;$env:PATH"
        $f = $env:ZMEYA_GTEST_FILTER_INSTRUMENTED
        OpenCppCoverage.exe --sources "Zmeya*.*" --excluded_sources "*googletest*" --modules "*.exe" -- "build/Release/ZmeyaTest.exe" "--gtest_filter=$f"
